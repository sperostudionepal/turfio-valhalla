name: Keep Valhalla Awake

on:
  schedule:
  - cron: "*/5 * * * *"
  workflow_dispatch:


permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
    - name: Ping Valhalla status endpoint
      shell: bash
      run: |
        set -euo pipefail

        response="$(curl --fail --silent --show-error \
          --retry 2 \
          --retry-delay 5 \
          --max-time 60 \
          https://turfio-valhalla.onrender.com/status)"

        echo "$response"

        echo "$response" | grep -q '"version":"3.5.1"'
